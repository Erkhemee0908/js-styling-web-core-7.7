<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Styling | Eric</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="brands">
        <h2 class="brands__title">Repair of equipment from various brands</h2>

        <div class="brands__slider swiper">
            <div class="brands__list swiper-wrapper">
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#lenovo" aria-label="Lenovo repair">
                        <span class="brands__logo">
                            <img height="32" class="brands__logo-img" src="assets/brand-lenovo.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#samsung" aria-label="Samsung repair">
                        <span class="brands__logo">
                            <img height="39" class="brands__logo-img" src="assets/brand-samsung.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#apple" aria-label="Apple repair">
                        <span class="brands__logo">
                            <img height="44" class="brands__logo-img" src="assets/brand-apple.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#viewsonic" aria-label="ViewSonic repair">
                        <span class="brands__logo">
                            <img height="21" class="brands__logo-img" src="assets/brand-view-sonic.png" alt="" /></span>

                        <img hidden="24" class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#bosch" aria-label="BOSCH repair">
                        <span class="brands__logo">
                            <img height="29" class="brands__logo-img" src="assets/brand-bosch.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#hp" aria-label="HP repair">
                        <span class="brands__logo">
                            <img height="52" class="brands__logo-img" src="assets/brand-hp.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#acer" aria-label="Acer repair">
                        <span class="brands__logo">
                            <img height="24" class="brands__logo-img" src="assets/brand-acer.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#sony" aria-label="SONY repair">
                        <span class="brands__logo">
                            <img height="25" class="brands__logo-img" src="assets/brand-sony.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#lenovo" aria-label="Lenovo repair">
                        <span class="brands__logo">
                            <img height="32" class="brands__logo-img" src="assets/brand-lenovo.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#samsung" aria-label="Samsung repair">
                        <span class="brands__logo">
                            <img height="39" class="brands__logo-img" src="assets/brand-samsung.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>
                <div class="brands__item swiper-slide">
                    <a class="brands__link" href="#apple" aria-label="Apple repair">
                        <span class="brands__logo">
                            <img height="44" class="brands__logo-img" src="assets/brand-apple.png" alt="" /></span>

                        <img class="brands__arrow" src="assets/style-project__arrow.svg" height="40" alt="">
                    </a>
                </div>

            </div>

            <div class="brands__pagination swiper-pagination"></div>
        </div>

        <button class="brands__expand-button" type="button">
            <img class="brands__expand-image" src="assets/style-project__expand.svg" alt="">
            <span class="brands__expand-text">Show all</span>
        </button>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
